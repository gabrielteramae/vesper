[project]
name = "vesper"
version = "0.1.0"
description = "Confere se um username existe em sites públicos de desenvolvedor."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Gabriel Teramae" }]
dependencies = []

[project.scripts]
vesper = "vesper.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vesper*"]
